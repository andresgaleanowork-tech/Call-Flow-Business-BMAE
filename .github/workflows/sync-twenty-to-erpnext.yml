# sync-twenty-to-erpnext.yml — A5.1 (§7.1 Prompt Maestro)
# Sincronización BIDIRECCIONAL Twenty ⇄ ERPNext: dedup por NIF/CIF+CUPS,
# concurrencia optimista, última escritura gana por timestamp ISO 8601 UTC.
# Idempotente: correrla dos veces NO duplica. DLQ = Issue privado etiquetado.

name: sync-twenty-to-erpnext

on:
  schedule:
    - cron: "*/15 * * * *"          # cada 15 min
  repository_dispatch:
    types: [twenty-mutation]        # disparo inmediato desde webhook Twenty
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo informe, sin escribir (auditoría)"
        type: boolean
        default: false

concurrency:
  group: sync-twenty-erpnext        # una corrida a la vez: nada de carreras
  cancel-in-progress: false

permissions:
  issues: write                     # DLQ como Issue etiquetado (§2, punto 5)
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TWENTY_BASE_URL: ${{ vars.TWENTY_BASE_URL }}
      ERPNEXT_BASE_URL: ${{ vars.ERPNEXT_BASE_URL }}
      TWENTY_API_TOKEN: ${{ secrets.TWENTY_API_TOKEN }}
      ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
      ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
    steps:
      - name: Checkout (solo scripts de integración del propio repo)
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar motor + utilidades
        run: pip install -e ./motor -e ./verifactu -e ./integracion

      - name: Sincronizar (bidireccional, idempotente, backoff exponencial)
        id: sync
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python integracion/scripts/sync_twenty_erpnext.py \
            --twenty "$TWENTY_BASE_URL" --erpnext "$ERPNEXT_BASE_URL" \
            --dry-run "$DRY_RUN" \
            --informe /tmp/sync-informe.json

      - name: Si algo quedó en DLQ → Issue privado etiquetado (contención GitHub)
        if: failure() && env.GITHUB_EVENT_ACTION != 'dry-run'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let informe = {};
            try { informe = JSON.parse(fs.readFileSync('/tmp/sync-informe.json','utf8')); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `DLQ sync Twenty⇄ERPNext · ${new Date().toISOString()}`,
              labels: ['dlq', 'sync'],
              body: '```json\n' + JSON.stringify(informe, null, 2).slice(0, 60000) + '\n```',
            });

      - name: Subir informe como artefacto (auditoría 30 días, dentro de GitHub)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-informe-${{ github.run_id }}
          path: /tmp/sync-informe.json
          retention-days: 30
