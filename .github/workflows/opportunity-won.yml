# opportunity-won.yml — A5.2 (§7.2 Prompt Maestro)
# Oportunidad GANADA en Twenty → en ERPNext: Customer (cuenta 430 PGC) +
# Sales Order + Project. Todo con API Keys por servicio, NUNCA personales.

name: opportunity-won

on:
  repository_dispatch:
    types: [opportunity-won]        # el webhook de Twenty emite este tipo
  workflow_dispatch:
    inputs:
      opportunity_id:
        description: "ID de oportunidad Twenty (replay manual idempotente)"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  provisionar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.client_payload.opportunity_id != null ||
      github.event.inputs.opportunity_id != null
    env:
      OPPORTUNITY_ID: >-
        ${{ github.event.client_payload.opportunity_id ||
            github.event.inputs.opportunity_id }}
      TWENTY_BASE_URL: ${{ vars.TWENTY_BASE_URL }}
      ERPNEXT_BASE_URL: ${{ vars.ERPNEXT_BASE_URL }}
      TWENTY_API_TOKEN: ${{ secrets.TWENTY_API_TOKEN }}
      ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
      ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ./motor -e ./verifactu -e ./integracion

      - name: Provisión ERPNext (Customer 430 + Sales Order + Project)
        run: |
          python integracion/scripts/opportunity_won.py \
            --oportunidad "$OPPORTUNITY_ID" \
            --informe /tmp/provision-informe.json

      - name: Artefacto de trazabilidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provision-${{ env.OPPORTUNITY_ID }}-${{ github.run_id }}
          path: /tmp/provision-informe.json
          retention-days: 90        # trazabilidad comercial conservada

      - name: Fallo → Issue DLQ con la oportunidad íntegra
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let informe = {};
            try { informe = JSON.parse(fs.readFileSync('/tmp/provision-informe.json','utf8')); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `DLQ opportunity-won · ${process.env.OPPORTUNITY_ID} · ${new Date().toISOString()}`,
              labels: ['dlq', 'opportunity-won'],
              body: '```json\n' + JSON.stringify(informe, null, 2).slice(0, 60000) + '\n```',
            });
