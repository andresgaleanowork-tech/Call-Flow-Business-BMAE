[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmae-integracion"
version = "0.1.0"
description = "Sincronización GitOps Twenty ⇄ ERPNext + auditoría VeriFactu (Bloque A5 BMAE)"
requires-python = ">=3.11"
dependencies = ["bmae-comparador", "bmae-verifactu", "requests>=2.31", "tenacity>=8.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
