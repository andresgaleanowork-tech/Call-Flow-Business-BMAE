<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://erp.bmae.example; frame-ancestors 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Volviendo al portal — BMAE</title>
<style>
:root{
  --azul-profundo:#0A2540; --azul-claro:#4A90E2; --amarillo:#FFD93D;
  --gris-050:#F8FAFC; --gris-500:#64748B; --texto:#0F172A; --fondo:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{ --fondo:#0F172A; --texto:#F1F5F9; --gris-050:#1E293B; }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  font:400 16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--fondo);color:var(--texto);
}
@media (prefers-reduced-motion: reduce){ .giro{animation:none!important} }
.tarjeta{
  width:min(420px,100%);text-align:center;display:grid;gap:20px;
  padding:40px 32px;background:var(--gris-050);border-radius:16px;
  box-shadow:0 10px 15px -3px rgba(10,37,64,.14);
}
.giro{
  width:48px;height:48px;margin:0 auto;border-radius:50%;
  border:3px solid var(--azul-profundo);border-top-color:var(--amarillo);
  animation:rodar .9s linear infinite;
}
.giro[hidden]{display:none}
@keyframes rodar{to{transform:rotate(360deg)}}
h1{font:600 24px/1.3 "Space Grotesk",Inter,system-ui,sans-serif;letter-spacing:-.01em}
.mensaje{color:var(--gris-500);font-size:15px}
.mensaje[role="alert"]{color:#DC2626}
.acciones{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.boton{
  min-height:44px;padding:10px 18px;border-radius:10px;border:0;cursor:pointer;
  font:600 15px Inter,system-ui,sans-serif;
  transition:transform .2s ease-out, background-color .2s ease-out;
}
.boton:focus-visible{outline:2px solid var(--azul-claro);outline-offset:2px}
.boton-primario{background:var(--azul-profundo);color:#fff}
.boton-primario:hover{background:#1E4D8C}
.boton-secundario{background:transparent;color:var(--texto);border:2px solid var(--gris-500)}
</style>
</head>
<body>
<main class="tarjeta" aria-label="Estado del acceso">
  <div class="giro" id="giro" aria-hidden="true"></div>
  <h1 id="titulo">Volviendo al portal…</h1>
  <p id="mensaje" class="mensaje" role="status" aria-live="polite">
    Estamos verificando tu acceso con GitHub y firmando tu sesión.
  </p>
  <div class="acciones" id="acciones" hidden>
    <button class="boton boton-primario" id="reintentar" type="button">Reintentar</button>
    <button class="boton boton-secundario" id="volver" type="button">Volver al inicio</button>
  </div>
</main>

<script type="module">
import { completarCallback } from './auth.js';
import { verificarJwt } from './jwt.js';

const giro = document.getElementById('giro');
const titulo = document.getElementById('titulo');
const mensaje = document.getElementById('mensaje');
const acciones = document.getElementById('acciones');
let intentos = 0;

function fallar(texto) {
  giro.hidden = true;
  titulo.textContent = 'No pudimos completar el acceso';
  mensaje.setAttribute('role', 'alert');
  mensaje.textContent = texto;
  acciones.hidden = false;
}

async function correr() {
  acciones.hidden = true;
  giro.hidden = false;
  titulo.textContent = 'Volviendo al portal…';
  mensaje.removeAttribute('role');
  mensaje.textContent = 'Estamos verificando tu acceso con GitHub y firmando tu sesión.';
  try {
    // §4.2 paso 5-7: code+state → endpoint Frappe auth_exchange (síncrono)
    const paquete = await completarCallback({
      search: location.search,
      intercambioFn: async (code, state, verifier) => {
        const r = await fetch('https://erp.bmae.example/api/method/bmae_auth.api.auth_exchange', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, state, verifier }),
        });
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          throw new Error(d.mensaje || `intercambio ${r.status}`);
        }
        return r.json();
      },
    });
    // verificación cliente defensiva con JWKS público (§4.1)
    const jwks = await (await fetch('https://erp.bmae.example/.well-known/jwks.json')).json();
    await verificarJwt({ token: paquete.access, jwks });
    location.replace('../dashboard/index.html');     // §4.2 paso 7-8
  } catch (e) {
    fallar(e.message.includes('state CSRF')
      ? 'La validación anti-CSRF falló. Por seguridad, vuelve a empezar.'
      : (e.message || 'Error inesperado durante el intercambio.'));
  }
}

document.getElementById('reintentar').addEventListener('click', () => {
  if (++intentos >= 2) { location.replace('login.html'); return; }
  correr();
});
document.getElementById('volver').addEventListener('click', () => location.replace('login.html'));

correr();
</script>
</body>
</html>
