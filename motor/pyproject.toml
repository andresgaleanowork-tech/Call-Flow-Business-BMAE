[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmae-comparador"
version = "0.1.0"
description = "Motor de cálculo tarifario CNMC de BMAE (Decimal exacto, 6 dec trabajo, HALF_UP final a 2)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
