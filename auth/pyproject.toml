[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmae-auth"
version = "0.1.0"
description = "Autenticación GitHub OAuth + PKCE + JWT RS256 (rotación trimestral kid, RBAC Teams) — Bloque B BMAE"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
